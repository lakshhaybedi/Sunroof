name: Sunroof
options:
  bundleIdPrefix: com.lakshhaybedi
  deploymentTarget:
    macOS: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Sunroof:
    type: application
    platform: macOS
    sources: [Sunroof]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    postBuildScripts:
      - name: Re-sign embedded frameworks for ad-hoc builds
        basedOnDependencyAnalysis: false
        script: |
          # Ad-hoc ("-") builds: Sparkle keeps its vendor signature, which library validation rejects
          # ("different Team IDs"). Re-sign it ad-hoc so it matches the app. Developer ID builds are
          # re-signed in the release workflow.
          if [ "$EXPANDED_CODE_SIGN_IDENTITY" = "-" ] || [ "$CODE_SIGN_IDENTITY" = "-" ]; then
            for f in "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"/*.framework; do
              [ -e "$f" ] && codesign --force --deep --sign - "$f"
            done
          fi
    settings:
      base:
        INFOPLIST_FILE: Sunroof/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lakshhaybedi.Sunroof
        PRODUCT_NAME: Sunroof
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO  # ad-hoc local builds (library validation rejects ad-hoc frameworks); release.yml re-signs with Developer ID + `codesign --options runtime`
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: 0.2.9
        CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)  # Sparkle compares CFBundleVersion; keep it equal to the version
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sunroof/Sunroof.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SPARKLE_PUBLIC_KEY: "gDzuwoaL+TjeSETtjlsXjErSjy596Dd2kyn3sajKj7Y="   # Sparkle EdDSA public key (private half: GitHub secret SPARKLE_ED_PRIVATE_KEY)
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
          DEAD_CODE_STRIPPING: YES         # drop unused code at link time
          DEPLOYMENT_POSTPROCESSING: YES   # actually run the strip step (STRIP_INSTALLED_PRODUCT is a no-op without it)
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # no get-task-allow in shipped builds: other processes can't attach a debugger
          ENABLE_HARDENED_RUNTIME: YES     # blocks code injection (e.g. DYLD_INSERT_LIBRARIES) into an app holding Accessibility/Calendar access
  SunroofTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SunroofTests]
    dependencies:
      - target: Sunroof
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sunroof.app/Contents/MacOS/Sunroof"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Sunroof:
    build:
      targets:
        Sunroof: all
        SunroofTests: [test]
    test:
      targets: [SunroofTests]
