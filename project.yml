name: ShelfScroll
options:
  bundleIdPrefix: com.lakshhaybedi
  deploymentTarget:
    macOS: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  ShelfScroll:
    type: application
    platform: macOS
    sources: [ShelfScroll]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    postBuildScripts:
      - name: Re-sign embedded frameworks for ad-hoc builds
        basedOnDependencyAnalysis: false
        script: |
          # Ad-hoc ("-") builds: Sparkle keeps its vendor signature, which library validation rejects
          # ("different Team IDs"). Re-sign it ad-hoc so it matches the app. Developer ID builds are
          # re-signed in the release workflow.
          if [ "$EXPANDED_CODE_SIGN_IDENTITY" = "-" ] || [ "$CODE_SIGN_IDENTITY" = "-" ]; then
            for f in "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"/*.framework; do
              [ -e "$f" ] && codesign --force --deep --sign - "$f"
            done
          fi
    settings:
      base:
        INFOPLIST_FILE: ShelfScroll/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lakshhaybedi.ShelfScroll
        PRODUCT_NAME: ShelfScroll
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO  # ad-hoc local builds; release.yml sets YES with Developer ID (library validation rejects ad-hoc frameworks)
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SPARKLE_PUBLIC_KEY: ""   # set from Sparkle's generate_keys (see RELEASING.md)
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
  ShelfScrollTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ShelfScrollTests]
    dependencies:
      - target: ShelfScroll
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShelfScroll.app/Contents/MacOS/ShelfScroll"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ShelfScroll:
    build:
      targets:
        ShelfScroll: all
        ShelfScrollTests: [test]
    test:
      targets: [ShelfScrollTests]
