name: Build
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - run: xcodebuild test -project ShelfScroll.xcodeproj -scheme ShelfScroll -destination 'platform=macOS,arch=arm64' -quiet
