name: Build
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Unit tests
        run: xcodebuild test -project Sunroof.xcodeproj -scheme Sunroof -destination 'platform=macOS,arch=arm64' -quiet
      - name: Release build + unsigned .dmg
        run: |
          xcodebuild -project Sunroof.xcodeproj -scheme Sunroof -configuration Release -derivedDataPath build -quiet build
          scripts/make-dmg.sh build/Build/Products/Release/Sunroof.app dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sunroof-unsigned-dmg
          path: dist/*.dmg
